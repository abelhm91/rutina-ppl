<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Rutina PPL</title>
<meta name="theme-color" content="#1a1f26" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)">
<meta name="description" content="Rutina Empuje, Tirón y Piernas con registro de series y temporizador de descanso.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: shell de app móvil — barra superior, contenido con scroll propio, navegación inferior; entrenamiento como pantalla completa encima. Discos olímpicos como colores de día. */

/* Sistema de diseño: Tangerine Orange (tweakcn/shadcn) — un solo acento mandarina sobre neutros gris azulado, radio 12px, Inter + JetBrains Mono.
   Capa de cristal suave: superficies translúcidas con desenfoque sobre un fondo con dos brillos de color. */
:root{
  /* oscuro */
  --bg:oklch(0.2188 0.0148 248.51); --card:oklch(0.2617 0.0197 254.84);
  --surface:oklch(0.2617 0.0197 254.84 / .62); --surface-2:oklch(0.2988 0.0207 257.27 / .78);
  --ink:oklch(0.9189 0 0); --muted:oklch(0.6993 0 0); --line:oklch(0.3408 0.0192 251.46 / .9);
  --primary:oklch(0.6802 0.1902 32); --on-primary:#fff; --destructive:oklch(0.6509 0.2199 25.04);
  --accent:oklch(0.3206 0.0396 254.68); --accent-ink:oklch(0.8996 0.0504 251.14);
  --push:oklch(0.6802 0.1902 32); --pull:oklch(0.7011 0.1193 239.70); --legs:oklch(0.8790 0.1690 91.61); --ok:oklch(0.7650 0.1770 163.22); --on-legs:oklch(0.2809 0 0);
  --glass-edge:oklch(1 0 0 / .08); --glass-hi:oklch(1 0 0 / .05); --shadow:0 8px 28px oklch(0 0 0 / .28);
  --glow:radial-gradient(60% 45% at 100% 0%, oklch(0.6802 0.1902 32 / .22), transparent 70%),radial-gradient(55% 40% at 0% 100%, oklch(0.7011 0.1193 239.70 / .16), transparent 70%);
  --display:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:12px; --blur:saturate(150%) blur(16px);
  --nav-h:64px; --bar-h:56px;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root{
  --bg:oklch(0.9846 0.0017 247.84); --card:oklch(1 0 0);
  --surface:oklch(1 0 0 / .66); --surface-2:oklch(0.9394 0.0046 258.33 / .8);
  --ink:oklch(0.2809 0 0); --muted:oklch(0.4999 0.0154 251.68); --line:oklch(0.9209 0.0035 247.86);
  --accent:oklch(0.9204 0.0203 238.68); --accent-ink:oklch(0.3808 0.1001 259.76);
  --pull:oklch(0.6011 0.1193 239.70); --legs:oklch(0.8290 0.1690 91.61); --ok:oklch(0.6650 0.1770 163.22);
  --glass-edge:oklch(1 0 0 / .7); --glass-hi:oklch(1 0 0 / .5); --shadow:0 8px 28px oklch(0.4 0.03 250 / .10);
  --glow:radial-gradient(60% 45% at 100% 0%, oklch(0.6802 0.1902 32 / .16), transparent 70%),radial-gradient(55% 40% at 0% 100%, oklch(0.7011 0.1193 239.70 / .14), transparent 70%);
  color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;overscroll-behavior:none}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-family:var(--display);line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
.lbl{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

/* Shell */
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
.topbar{flex:none;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;min-height:var(--bar-h)}
.topbar h1{font-size:1.75rem;font-weight:700}
.topbar .sub{font-size:.85rem;color:var(--muted)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}
.view{display:flex;flex-direction:column;gap:18px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:.72rem;font-weight:600;cursor:pointer}
.nav svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] .ni{background:var(--surface-2)}
.ni{display:grid;place-items:center;width:56px;height:30px;border-radius:999px;transition:background .2s}

/* Tarjetas */
.card{background:var(--surface);border-radius:var(--r);padding:16px}
.hero{border-radius:var(--r);padding:18px;background:var(--surface);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.hero::after{content:"";position:absolute;right:-74px;top:-74px;width:130px;height:130px;border-radius:50%;border:16px solid var(--day);opacity:.16;pointer-events:none}
.hero h2{font-size:2.4rem;font-weight:700;color:var(--day)}
.hero .muscles{color:var(--muted);font-size:.95rem}
.hero-stats{display:flex;gap:18px;font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.hero-stats b{display:block;color:var(--ink);font-family:var(--display);font-size:1.5rem;font-weight:700}
.btn-go{border:0;border-radius:var(--r);min-height:56px;background:var(--day);color:#fff;font-family:var(--display);font-weight:700;font-size:1.08rem;letter-spacing:0;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;width:100%}
.btn-go.legs,.legs .btn-go{color:var(--on-legs)}
.btn-go svg{width:22px;height:22px}
.row-days{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.mini{background:var(--surface);border:0;border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-height:96px}
.mini .dot{width:26px;height:6px;border-radius:3px;background:var(--day)}
.mini b{font-family:var(--display);font-size:1rem;font-weight:700}
.mini small{color:var(--muted);font-size:.75rem}
.sec-h{display:flex;justify-content:space-between;align-items:baseline}
.sec-h h3{font-size:1.35rem;font-weight:700}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.weekstrip div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.72rem;color:var(--muted);font-weight:600}
.weekstrip i{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-style:normal;font-family:var(--display);font-size:.95rem;color:var(--muted)}
.weekstrip .today i{outline:2px solid var(--ink);outline-offset:2px}
.weekstrip i.P{background:var(--push);color:#fff}.weekstrip i.T{background:var(--pull);color:#fff}.weekstrip i.L{background:var(--legs);color:var(--on-legs)}
.hist{display:flex;flex-direction:column}
.hist-row{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.hist-row:last-child{border-bottom:0}
.hist-row .bar{width:6px;height:36px;border-radius:3px;background:var(--day)}
.hist-row b{font-weight:600}
.hist-row small{display:block;color:var(--muted);font-size:.8rem}
.hist-row .v{font-family:var(--mono);font-size:.82rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:.92rem;padding:6px 0}

/* Rutina */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:var(--r);padding:4px;gap:4px;position:sticky;top:0;z-index:5}
.seg button{border:0;background:none;min-height:42px;border-radius:9px;font-family:var(--display);font-weight:600;font-size:.95rem;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--day);color:#fff}
.seg button.legs[aria-selected="true"]{color:var(--on-legs)}
.exl{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.exi{background:var(--surface);border-radius:var(--r);overflow:hidden}
.exi-h{width:100%;border:0;background:none;text-align:left;padding:14px;display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;cursor:pointer}
.num{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--day)}
.exi-h b{display:block;font-weight:600;font-size:1.02rem;line-height:1.25}
.exi-h small{color:var(--muted);font-size:.82rem;font-family:var(--mono)}
.chev{width:20px;height:20px;color:var(--muted);transition:transform .2s}
.exi[open-x] .chev{transform:rotate(180deg)}
.exi-b{padding:0 14px 14px 62px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:.75rem;color:var(--muted)}
.tip{color:var(--muted);font-size:.92rem}
.last{font-family:var(--mono);font-size:.8rem;color:var(--ink)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:10px;background:var(--surface-2);color:var(--ink);text-decoration:none;font-weight:600;font-size:.85rem}
.links svg{width:16px;height:16px}
.note{font-size:.88rem;color:var(--muted);text-align:center}

/* Consejos */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat .big{font-family:var(--display);font-weight:700;font-size:1.8rem;line-height:1;font-variant-numeric:tabular-nums}
.stat .big small{font-size:.85rem;color:var(--muted);font-weight:700}
.stat p{font-size:.8rem;color:var(--muted)}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.rules li{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px}
.rules b{font-weight:600}
.rules span{color:var(--muted);font-size:.9rem}
.profile{display:flex;gap:14px;font-family:var(--mono);font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.profile b{color:var(--ink);font-weight:500}

/* Entrenamiento a pantalla completa */
.train{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.train-in{max-width:560px;width:100%;margin:0 auto;height:100%;display:flex;flex-direction:column}
.t-top{flex:none;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.t-row{display:flex;align-items:center;gap:10px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:22px;height:22px}
.t-title{flex:1;min-width:0}
.t-title .lbl{color:var(--day)}
.t-time{font-family:var(--mono);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.t-end{border:0;border-radius:12px;min-height:44px;padding:0 16px;background:var(--ink);color:var(--bg);font-weight:700;cursor:pointer}
.pbar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.pbar span{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.t-prog{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.t-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(130px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.tex{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;border:2px solid transparent;transition:border-color .2s}
.tex.current{border-color:var(--day)}
.tex.is-done{border-color:color-mix(in srgb,var(--ok) 60%,transparent)}
.tex-h{display:flex;gap:12px;align-items:center}
.tex-h .num{flex:none}
.tex.is-done .num{background:var(--ok);color:#fff}
.tex-h b{display:block;font-weight:600;font-size:1.05rem;line-height:1.2}
.tex-h small{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.tex-h a{margin-left:auto;flex:none}
.sets{display:flex;flex-direction:column;gap:6px}
.set-head,.set{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 50px;gap:8px;align-items:center}
.set-head{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.set-head span:last-child{text-align:center}
.sn{font-family:var(--mono);text-align:center;color:var(--muted);font-weight:500}
.fld{display:flex;align-items:center;gap:4px;background:var(--surface-2);border:1.5px solid transparent;border-radius:12px;padding:0 10px;min-height:48px;min-width:0}
.fld:focus-within{border-color:var(--day)}
.fld input{all:unset;flex:1;min-width:0;width:100%;font-family:var(--mono);font-size:1.15rem;font-variant-numeric:tabular-nums;color:var(--ink);padding:10px 0}
.fld input::placeholder{color:var(--muted);opacity:.55}
.fld span{font-size:.72rem;color:var(--muted)}
.tick{width:50px;height:48px;border-radius:12px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;color:transparent;padding:0}
.tick svg{width:24px;height:24px}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.set.is-done .sn{color:var(--ok)}
.set.is-done .fld{background:color-mix(in srgb,var(--ok) 12%,var(--surface-2))}

.restbar{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));border-radius:var(--r);background:var(--day);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.restbar.legs{color:var(--on-legs)}
.rb-t{flex:1;display:flex;flex-direction:column}
.rb-t .lbl{color:inherit;opacity:.8}
.rb-time{font-family:var(--mono);font-size:1.9rem;transition:color .2s;line-height:1;font-variant-numeric:tabular-nums}
.restbar button{border:2px solid currentColor;background:transparent;color:inherit;border-radius:12px;min-height:44px;padding:0 10px;font-weight:700;cursor:pointer;opacity:.9}
.restbar .rb-skip{background:#fff;color:#14171c;border-color:#fff;opacity:1}
.restbar.legs .rb-skip{background:var(--on-legs);color:#fff;border-color:var(--on-legs)}
@media (prefers-reduced-motion:no-preference){.restbar.over{animation:pulse 1s ease-in-out 3}.train{animation:up .25s ease-out}}
@keyframes pulse{50%{filter:brightness(1.2)}}
@keyframes up{from{transform:translateY(24px);opacity:.4}}

/* Hoja inferior */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:20px 20px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet h3{font-size:1.4rem;font-weight:700}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum div{background:var(--surface-2);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px}
.sum b{font-family:var(--display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.sheet-btns{display:flex;flex-direction:column;gap:8px}
.btn{border:0;border-radius:var(--r);min-height:52px;font-weight:700;font-size:1rem;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--push)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:70}

/* Utilidades */
.gap10{gap:10px}.gap14{gap:14px}.mb4{margin-bottom:4px}.mb8{margin-bottom:8px}
.note.left{text-align:left}
body.lock{overflow:hidden}
.btn.sm{min-height:44px;font-size:.92rem;padding:0 14px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.plain{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:.92rem}
.plain b{color:var(--ink);font-weight:600}
.banner{display:flex;flex-direction:column;gap:8px;border:2px solid var(--ok)}
.banner h3,.how h3{font-size:1.4rem;font-weight:700}
.banner.deload{border-color:var(--legs)}
.how{display:flex;flex-direction:column;gap:10px}
.weeks{display:flex;gap:6px}
.weeks span{flex:1;height:34px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.weeks span.past{background:color-mix(in srgb,var(--ok) 35%,var(--surface-2));color:var(--ink)}
.weeks span.now{background:var(--ink);color:var(--bg)}
.weeks span.dl{border:1.5px dashed var(--legs)}
.block-card{display:flex;flex-direction:column;gap:12px}
.row-days.n2{grid-template-columns:1fr 1fr}
.row-days.n4{grid-template-columns:1fr 1fr}
.row-days.n5,.row-days.n6{grid-template-columns:1fr 1fr 1fr}
.mini b{font-size:1.1rem;line-height:1.05}
.weekstrip i.on{background:var(--day);color:#fff}
.seg-scroll{overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none;position:sticky;top:0;z-index:5;background:var(--bg);padding-block:2px 6px}
.seg-scroll::-webkit-scrollbar{display:none}
.seg{position:static;display:flex;width:max-content;min-width:100%}
.seg button{flex:1 0 auto;padding:0 14px;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--day)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted);flex:none}
.kv b{font-weight:600;text-align:right;min-width:0}
.prof{display:flex;flex-direction:column;gap:12px}
.prof-h{display:flex;gap:14px;align-items:center}.prof-h b{display:block;font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1}.prof-h small{color:var(--muted);font-size:.9rem}
.avatar{width:64px;height:64px;border-radius:var(--r);background:var(--push);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:2.2rem}
.prof-data{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
.stat.wide{grid-column:1/-1}
.last{margin:-2px 0 0}

/* Cuestionario */
.onb{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.onb-in{max-width:560px;width:100%;margin:0 auto;height:100%;display:flex;flex-direction:column}
.onb-top{flex:none;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 6px;display:flex;flex-direction:column;gap:12px}
.onb-row{display:flex;align-items:center;justify-content:space-between}
.onb-body{flex:1;overflow-y:auto;padding:12px 16px 24px;display:flex;flex-direction:column;gap:10px}
.onb-body h2{font-size:1.85rem;font-weight:700}
.onb-fields{display:flex;flex-direction:column;gap:14px;margin-top:10px}
.onb-foot{flex:none;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.onb-foot .btn{width:100%;min-height:56px;font-size:1.05rem}
.btn:disabled{opacity:.35;cursor:not-allowed}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:1.1rem;letter-spacing:.04em}
.brand i{display:flex;gap:3px;align-items:center}
.brand i span{width:5px;border-radius:2px}
.in-big{display:flex;flex-direction:column;gap:8px}
.in-big input,.in-unit input{all:unset;box-sizing:border-box;width:100%;min-width:0;font-family:var(--body);font-size:1.4rem;font-weight:600;color:var(--ink)}
.in-big>input,.in-unit{background:var(--surface);border:2px solid transparent;border-radius:var(--r);padding:14px 16px;min-height:60px}
.in-big>input:focus,.in-unit:focus-within{border-color:var(--ink)}
.in-unit{display:flex;align-items:center;gap:8px}
.in-unit span{color:var(--muted);font-weight:600;flex:none}
.in-big input::placeholder{color:var(--muted);opacity:.5}
.oseg{display:grid;gap:8px}
.oseg.n2{grid-template-columns:1fr 1fr}.oseg.n4{grid-template-columns:repeat(4,1fr)}.oseg.n5{grid-template-columns:repeat(5,1fr)}
.oseg button{border:2px solid transparent;background:var(--surface);border-radius:var(--r);min-height:56px;font-family:var(--display);font-weight:600;font-size:1.15rem;cursor:pointer}
.oseg button[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.ocards{display:flex;flex-direction:column;gap:10px}
.ocard{border:2px solid transparent;background:var(--surface);border-radius:var(--r);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:3px;cursor:pointer;position:relative;padding-right:48px}
.ocard b{font-size:1.08rem;font-weight:700}
.ocard small{color:var(--muted);font-size:.88rem;line-height:1.35}
.ocard::after{content:"";position:absolute;right:16px;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;border:2px solid var(--line)}
.ocard[aria-pressed="true"]{border-color:var(--ink)}
.ocard[aria-pressed="true"]::after{border-color:var(--ok);background:var(--ok);box-shadow:inset 0 0 0 4px var(--surface)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:2px solid transparent;background:var(--surface);border-radius:999px;min-height:48px;padding:0 18px;font-weight:600;cursor:pointer}
.pill[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.hint{color:var(--muted);font-size:.88rem;min-height:1.2em}
.toggle{border:0;background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;gap:14px;align-items:center;text-align:left;cursor:pointer}
.toggle b{display:block;font-weight:700}
.toggle small{color:var(--muted);font-size:.86rem}
.sw{flex:none;width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle[aria-pressed="true"] .sw{background:var(--ok)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(20px)}
.sum-plan{background:var(--surface);border-radius:var(--r);padding:4px 16px}

/* Guía */
.top-r{display:flex;align-items:center;gap:10px}
.icon-btn.help{width:40px;height:40px;border-radius:50%;font-family:var(--display);font-weight:700;font-size:1.3rem;color:var(--ink)}
.guide{position:fixed;inset:0;z-index:55;background:var(--bg);display:flex;flex-direction:column}
.g-skip{border:0;background:none;color:var(--muted);font-weight:600;min-height:44px;padding:0 6px;cursor:pointer}
.g-track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.g-track::-webkit-scrollbar{display:none}
.g-slide{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:10px}
.g-slide h2{font-size:1.85rem;font-weight:700}
.g-body{display:flex;flex-direction:column;gap:14px;font-size:1rem}
.g-body p b{font-weight:700}
.g-note{color:var(--muted);font-size:.9rem;background:var(--surface);border-radius:var(--r);padding:12px 14px}
.g-foot{flex:none;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.g-dots{display:flex;gap:6px;justify-content:center}
.g-dots i{width:8px;height:8px;border-radius:4px;background:var(--line);cursor:pointer;transition:width .2s,background .2s}
.g-dots i.on{width:24px;background:var(--ink)}
.g-btns{display:flex;gap:10px}
.g-btns .icon-btn{width:56px;height:56px;border-radius:var(--r)}
.g-btns .btn{flex:1;min-height:56px;font-size:1.05rem}
.g-sessions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g-sessions div{background:var(--surface);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:28px 1fr;column-gap:10px;align-items:center}
.g-sessions span{grid-row:span 2;width:28px;height:28px;border-radius:8px;background:var(--day);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700}
.g-sessions b{font-weight:700;font-size:.95rem;line-height:1.15}
.g-sessions small{color:var(--muted);font-size:.78rem}
.g-rir{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.g-reps{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.g-reps i{font-style:normal;height:36px;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-size:.8rem}
.g-reps i.done{background:var(--ok);color:#fff}
.g-reps i.left{border:2px dashed var(--muted);color:var(--muted)}
.g-steps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g-steps div{background:var(--surface);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px}
.g-steps b{font-family:var(--display);font-weight:700;font-size:1.5rem}
.g-steps small{font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.g-steps .up{outline:2px solid var(--ok)}
.g-steps .up2{background:color-mix(in srgb,var(--ok) 18%,var(--surface))}
.g-weeks{display:flex;flex-direction:column;gap:6px}
.g-weeks div{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border-radius:12px;padding:10px 14px;font-family:var(--mono);font-size:.85rem}
.g-weeks div span{color:var(--muted)}
.g-weeks div.dl{border:1.5px dashed var(--legs)}
.g-weeks div.now{outline:2px solid var(--ink)}
.g-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.g-list li{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.g-list b{font-weight:700}
.g-list span{color:var(--muted);font-size:.9rem}
.g-nut{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g-nut div{background:var(--surface);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.g-nut b{font-family:var(--display);font-weight:700;font-size:1.45rem}
.g-nut small{color:var(--muted);font-size:.75rem}
.guide-link{border:0;background:var(--surface);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:40px 1fr 20px;gap:12px;align-items:center;text-align:left;cursor:pointer}
.guide-link b{display:block;font-weight:700}
.guide-link small{color:var(--muted);font-size:.85rem}
.gl-ic{width:40px;height:40px;border-radius:12px;background:var(--pull);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.4rem}
.chip-btn{border:0;cursor:pointer;font:inherit;font-size:.75rem}

/* Ajuste de calorías */
.adj{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.adj-h b{display:block;font-weight:700}
.adj-h small{display:block;line-height:1.4;margin-top:2px}
.adj-h small,.adj-f{color:var(--muted);font-size:.86rem}
.adj-r{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:center;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.adj-r small{display:block;color:var(--muted);font-size:.84rem;line-height:1.3}
.adj-r b{font-weight:700;font-size:.98rem}
.adj-i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--muted)}
.adj-r.ok .adj-i{background:var(--ok)}
.adj-r.up .adj-i{background:var(--pull)}
.adj-r.down .adj-i{background:var(--push)}
.adj-k{font-family:var(--mono);font-weight:500;white-space:nowrap}

/* Historial editable */
button.hist-row{width:100%;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
button.hist-row:last-child{border-bottom:0}
.link-btn{border:0;background:none;color:var(--pull);font-weight:600;font-size:.9rem;cursor:pointer;min-height:36px;padding:0}
.histv{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column}
.histv h2{font-size:1.4rem;font-weight:700}
.hv-body{flex:1;overflow-y:auto;padding:6px 16px 24px;display:flex;flex-direction:column;gap:12px}
.hv-group{display:flex;flex-direction:column;gap:6px}
.hv-group .card{padding:4px 16px}
.hv-sum b small{font-size:.9rem;color:var(--muted)}
.hv-foot{flex:none;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line)}
.set-head.hv,.set.hv{grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 44px}
.del-set{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.del-set svg{width:20px;height:20px}
.del-set:hover,.del-set:focus-visible{color:var(--push);background:var(--surface-2)}
.add-set{border:1.5px dashed var(--line);background:none;color:var(--muted);border-radius:12px;min-height:44px;font-weight:600;cursor:pointer}

/* Peso sugerido y récords */
.sug{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.sug-i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--line);color:var(--ink)}
.sug.up .sug-i{background:var(--ok);color:#fff}
.sug b{display:block;font-weight:700;font-size:.98rem}
.sug small{color:var(--muted);font-size:.8rem;line-height:1.3;display:block}
.set.pr .sn{color:var(--legs)}
.set.pr .fld{box-shadow:inset 0 0 0 2px var(--legs)}
.set.pr .sn::after{content:"🏆";font-size:.7rem;display:block;line-height:1}
.pr-line{background:color-mix(in srgb,var(--legs) 18%,var(--surface-2));border-radius:12px;padding:10px 12px;font-weight:700}
.pr-badge{font-size:.78rem;color:var(--ink)}

/* Progreso */
.stat-grid.three{grid-template-columns:repeat(3,1fr)}
.stat-grid.three .big{font-size:1.6rem}
.pcard{display:flex;flex-direction:column;gap:12px}
.chips-scroll{display:flex;gap:6px;overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips-scroll::-webkit-scrollbar{display:none}
.echip{flex:none;border:1.5px solid var(--line);background:none;color:var(--muted);border-radius:999px;min-height:38px;padding:0 14px;font-weight:600;font-size:.85rem;cursor:pointer;white-space:nowrap}
.echip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ex-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ex-stats div{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ex-stats b{font-family:var(--display);font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums}
.ex-stats small{color:var(--muted);font-size:.72rem}
.pos{color:var(--ok)}.neg{color:var(--push)}
.chart{position:relative;touch-action:pan-y;user-select:none}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-family:var(--mono);font-size:10px}
.chart .val{fill:var(--ink);font-family:var(--mono);font-size:11px;font-weight:500}
.chart .line{fill:none;stroke:var(--c);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--c);opacity:.12}
.chart .dot{fill:var(--c);stroke:var(--surface);stroke-width:2}
.chart .dot.pr{fill:var(--legs)}
.chart .dot.end{fill:var(--c);stroke:var(--surface);stroke-width:2}
.chart .cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .bar{fill:var(--c);opacity:.55}
.chart .bar.cur{opacity:1}
.chart .bar.hl{opacity:1}
.chart .tt{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:6px 10px;font-size:.8rem;line-height:1.3;white-space:nowrap;z-index:2}
.chart-cap{color:var(--muted);font-size:.8rem}
.mini-hist{display:flex;flex-direction:column}
.mh-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:.8rem;font-variant-numeric:tabular-nums}
.mh-row:last-child{border-bottom:0}
.mh-row span:first-child{color:var(--muted);flex:none}
.mh-row span:last-child{text-align:right}
.mini-seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.mini-seg button{border:0;background:none;color:var(--muted);border-radius:8px;min-height:32px;padding:0 10px;font-weight:600;font-size:.82rem;cursor:pointer}
.mini-seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.body-now{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.body-now b{font-family:var(--display);font-weight:700;font-size:2rem}
.body-now span{font-size:.88rem;font-weight:600}
.nav button{font-size:.68rem}
body.lock .toast{bottom:calc(112px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);text-align:center}
.restbar.over{background:var(--ok);color:#fff}
.restbar.over .rb-skip{background:#fff;color:#14171c;border-color:#fff}

/* ===== Tangerine Orange + cristal suave ===== */
body{background:var(--glow),var(--bg);background-color:var(--bg)}
.train,.onb,.guide,.histv{background:var(--glow),var(--bg);background-color:var(--bg)}
.card,.hero,.mini,.exi,.tex,.stat,.rules li,.sum-plan,.adj,.g-note,.g-list li,.g-steps div,.g-sessions div,.g-weeks div,.g-nut div,.g-rir,.ocard,.toggle,.pill,.in-big>input,.in-unit,.oseg button,.guide-link,.seg,.icon-btn,.sheet,.mini-seg{
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow)}
.ocard,.oseg button,.pill{border-width:2px}
.ocard[aria-pressed="true"],.oseg button[aria-pressed="true"],.pill[aria-pressed="true"]{border-color:var(--primary);background:color-mix(in oklch,var(--primary) 14%,var(--surface))}
.ocard[aria-pressed="true"]::after{border-color:var(--primary);background:var(--primary)}
.tex.current{border-color:var(--day)}
.nav{background:color-mix(in oklch,var(--card) 70%,transparent);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-top:1px solid var(--glass-edge)}
.nav button[aria-current="page"]{color:var(--primary)}
.nav button[aria-current="page"] .ni{background:color-mix(in oklch,var(--primary) 16%,transparent)}
.btn.primary,.t-end{background:var(--primary);color:var(--on-primary);box-shadow:0 6px 18px oklch(0.6802 0.1902 32 / .35)}
.btn.ghost{background:var(--surface-2);border:1px solid var(--glass-edge)}
.btn.danger{color:var(--destructive)}
.btn-go{box-shadow:0 8px 22px color-mix(in oklch,var(--day) 40%,transparent);font-weight:700}
.restbar{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);background:color-mix(in oklch,var(--day) 82%,transparent);border:1px solid oklch(1 0 0 / .18)}
.restbar.over{background:color-mix(in oklch,var(--ok) 85%,transparent)}
.toast{background:color-mix(in oklch,var(--card) 80%,transparent);color:var(--ink);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-edge);box-shadow:var(--shadow)}
.scrim{background:oklch(0 0 0 / .35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet{background:color-mix(in oklch,var(--card) 82%,transparent)}
.avatar{background:var(--primary)}
.gl-ic{background:var(--primary)}
.icon-btn.help{color:var(--primary)}
.link-btn{color:var(--primary)}
.weeks span.now{background:var(--primary);color:var(--on-primary)}
.echip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.mini-seg button[aria-pressed="true"]{background:var(--card)}
.g-dots i.on{background:var(--primary)}
.pbar span,.progress span{background:var(--primary)}
.sw{background:var(--line)}
.toggle[aria-pressed="true"] .sw{background:var(--primary)}
.seg-scroll{background:transparent}
.hero h2{letter-spacing:-.03em}
@media (prefers-color-scheme:light){ .hero h2,.t-title .lbl,.tex .num,.exi .num{color:color-mix(in oklch,var(--day) 70%,var(--ink))} }
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:oklch(0.2188 0.0148 248.51)}
.chart .tt{background:color-mix(in oklch,var(--card) 90%,transparent);color:var(--ink);border:1px solid var(--glass-edge);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.fld{background:color-mix(in oklch,var(--surface-2) 90%,transparent)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ :root{--surface:var(--card)} }
@media (prefers-reduced-transparency:reduce){ :root{--surface:var(--card)} .card,.hero,.mini,.exi,.tex,.stat{backdrop-filter:none;-webkit-backdrop-filter:none} }

/* Cambiar ejercicio */
.tex-h .tex-acts{margin-left:auto;display:flex;gap:6px;flex:none}
.tex-h .tex-acts .icon-btn{width:40px;height:40px}
.swap-btn svg{width:20px;height:20px;color:var(--muted)}
.swapped{font-size:.8rem;color:var(--primary);font-weight:600;margin-top:-4px}
.sheet{max-height:88vh;overflow-y:auto}
.swap-list{display:flex;flex-direction:column;gap:8px;max-height:42vh;overflow-y:auto;margin-inline:-4px;padding:2px 4px}
.swap-opt{border:2px solid var(--glass-edge);background:var(--surface-2);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;color:var(--ink)}
.swap-opt[aria-checked="true"]{border-color:var(--primary);background:color-mix(in oklch,var(--primary) 14%,var(--surface-2))}
.so-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.so-main b{font-weight:600}
.so-main small{color:var(--muted);font-size:.8rem}
.so-last{font-family:var(--mono);font-size:.72rem!important}
.so-tag{flex:none;font-size:.7rem;font-weight:600;color:var(--muted);background:var(--surface);border-radius:999px;padding:3px 8px}
.warn{font-size:.85rem;color:var(--destructive);font-weight:600}
.swap-when button{font-size:.95rem!important;min-height:48px!important}
</style>

    <button type="button" data-view="plan"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12h3M19 12h3M5 8v8M8 6v12M16 6v12M19 8v8M8 12h8"/></svg></span>Rutina</button>
    <button type="button" data-view="progress"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg></span>Progreso</button>
    <button type="button" data-view="profile"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></span>Perfil</button>
  </div>
</nav>

<div class="onb" id="onb" hidden role="dialog" aria-modal="true" aria-label="Crear tu rutina">
  <div class="onb-in">
    <div class="onb-top">
      <div class="onb-row">
        <button type="button" class="icon-btn" id="onbBack" aria-label="Atrás"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <span class="brand"><i aria-hidden="true"><span style="height:16px;background:var(--push)"></span><span style="height:13px;background:var(--pull)"></span><span style="height:10px;background:var(--legs)"></span></i>Rutina PPL</span>
        <span class="lbl" id="onbStep">1 de 11</span>
      </div>
      <div class="pbar"><span id="onbBar"></span></div>
    </div>
    <div class="onb-body" id="onbBody"></div>
    <div class="onb-foot"><button type="button" class="btn primary" id="onbNext">Continuar</button></div>
  </div>
</div>

<div class="train" id="train" hidden role="dialog" aria-modal="true" aria-labelledby="tDay">
  <div class="train-in">
    <div class="t-top">
      <div class="t-row">
        <button type="button" class="icon-btn" id="tMin" aria-label="Minimizar entrenamiento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="t-title"><div class="lbl" id="tDay">Empuje</div><div class="t-time" id="tTime" role="timer">00:00</div></div>
        <button type="button" class="t-end" id="tEnd">Terminar</button>
      </div>
      <div class="pbar"><span id="tBar"></span></div>
      <div class="t-prog"><span id="tProg">0/0 series</span><span id="tVol">0 kg</span></div>
    </div>
    <div class="t-list" id="tList"></div>
    <div class="restbar" id="restbar" hidden role="status">
      <div class="rb-t"><span class="lbl" id="rbLbl">Descanso</span><span class="rb-time" id="rbTime">0:00</span></div>
      <button type="button" id="rbMinus" aria-label="Quitar 15 segundos">−15</button>
      <button type="button" id="rbPlus" aria-label="Añadir 15 segundos">+15</button>
      <button type="button" id="rbSkip" class="rb-skip">Saltar</button>
    </div>
  </div>
</div>

<div class="histv" id="histv" hidden role="dialog" aria-modal="true" aria-labelledby="hvTitle">
  <div class="onb-in">
    <div class="onb-top"><div class="t-row">
      <button type="button" class="icon-btn" id="hvBack" aria-label="Volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="t-title"><h2 id="hvTitle">Historial</h2><div class="lbl" id="hvSub"></div></div>
    </div></div>
    <div class="hv-body" id="hvBody"></div>
    <div class="hv-foot" id="hvFoot" hidden><button type="button" class="btn primary" id="hvSave">Guardar cambios</button><button type="button" class="btn danger" id="hvDelete">Eliminar entrenamiento</button></div>
  </div>
</div>
<div class="guide" id="guide" hidden role="dialog" aria-modal="true" aria-label="Cómo funciona tu plan">
  <div class="onb-in">
    <div class="onb-top"><div class="onb-row">
      <span class="brand"><i aria-hidden="true"><span style="height:16px;background:var(--push)"></span><span style="height:13px;background:var(--pull)"></span><span style="height:10px;background:var(--legs)"></span></i>Tu plan</span>
      <button type="button" class="g-skip" id="gSkip">Cerrar</button>
    </div></div>
    <div class="g-track" id="gTrack"></div>
    <div class="g-foot">
      <div class="g-dots" id="gDots"></div>
      <div class="g-btns"><button type="button" class="icon-btn" id="gPrev" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button><button type="button" class="btn primary" id="gNext">Siguiente</button></div>
    </div>
  </div>
</div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="js/library.js"></script>
<script src="js/app.js"></script>
</body>
</html>
