<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Rutina PPL</title>
<meta name="theme-color" content="#0f1115">
<meta name="description" content="Rutina Empuje, Tirón y Piernas con registro de series y temporizador de descanso.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: shell de app móvil — barra superior, contenido con scroll propio, navegación inferior; entrenamiento como pantalla completa encima. Discos olímpicos como colores de día. */
:root{
  --bg:#0f1115; --surface:#181b21; --surface-2:#21252d; --ink:#f1f3f6; --muted:#8d95a3; --line:#2a2f38;
  --push:#ef4a4f; --pull:#4d8bf0; --legs:#f2c230; --ok:#3fbf7a; --on-legs:#1a1500;
  --display:"Big Shoulders Display","Impact","Arial Narrow",sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --nav-h:64px; --bar-h:56px;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root{
  --bg:#f2f3f5; --surface:#ffffff; --surface-2:#eceef2; --ink:#14171c; --muted:#5d6572; --line:#dde0e6;
  --push:#d22d32; --pull:#1f5fbf; --legs:#d9a400; --ok:#24985a; color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;overscroll-behavior:none}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-family:var(--display);line-height:1;letter-spacing:.01em;text-wrap:balance}
p{margin:0}
.lbl{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:3px solid var(--pull);outline-offset:2px}

/* Shell */
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
.topbar{flex:none;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;min-height:var(--bar-h)}
.topbar h1{font-size:2.1rem;font-weight:900;text-transform:uppercase}
.topbar .sub{font-size:.85rem;color:var(--muted)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}
.view{display:flex;flex-direction:column;gap:18px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:.72rem;font-weight:600;cursor:pointer}
.nav svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] .ni{background:var(--surface-2)}
.ni{display:grid;place-items:center;width:56px;height:30px;border-radius:999px;transition:background .2s}

/* Tarjetas */
.card{background:var(--surface);border-radius:18px;padding:16px}
.hero{border-radius:22px;padding:18px;background:var(--surface);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.hero::after{content:"";position:absolute;right:-56px;top:-56px;width:130px;height:130px;border-radius:50%;border:16px solid var(--day);opacity:.16;pointer-events:none}
.hero h2{font-size:3rem;font-weight:900;text-transform:uppercase;color:var(--day)}
.hero .muscles{color:var(--muted);font-size:.95rem}
.hero-stats{display:flex;gap:18px;font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.hero-stats b{display:block;color:var(--ink);font-family:var(--display);font-size:1.5rem;font-weight:700}
.btn-go{border:0;border-radius:14px;min-height:56px;background:var(--day);color:#fff;font-family:var(--display);font-weight:900;font-size:1.45rem;text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;width:100%}
.btn-go.legs,.legs .btn-go{color:var(--on-legs)}
.btn-go svg{width:22px;height:22px}
.row-days{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.mini{background:var(--surface);border:0;border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-height:96px}
.mini .dot{width:26px;height:6px;border-radius:3px;background:var(--day)}
.mini b{font-family:var(--display);font-size:1.3rem;font-weight:900;text-transform:uppercase}
.mini small{color:var(--muted);font-size:.75rem}
.sec-h{display:flex;justify-content:space-between;align-items:baseline}
.sec-h h3{font-size:1.35rem;font-weight:700;text-transform:uppercase}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.weekstrip div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.72rem;color:var(--muted);font-weight:600}
.weekstrip i{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-style:normal;font-family:var(--display);font-size:.95rem;color:var(--muted)}
.weekstrip .today i{outline:2px solid var(--ink);outline-offset:2px}
.weekstrip i.P{background:var(--push);color:#fff}.weekstrip i.T{background:var(--pull);color:#fff}.weekstrip i.L{background:var(--legs);color:var(--on-legs)}
.hist{display:flex;flex-direction:column}
.hist-row{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.hist-row:last-child{border-bottom:0}
.hist-row .bar{width:6px;height:36px;border-radius:3px;background:var(--day)}
.hist-row b{font-weight:600}
.hist-row small{display:block;color:var(--muted);font-size:.8rem}
.hist-row .v{font-family:var(--mono);font-size:.82rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:.92rem;padding:6px 0}

/* Rutina */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:14px;padding:4px;gap:4px;position:sticky;top:0;z-index:5}
.seg button{border:0;background:none;min-height:42px;border-radius:10px;font-family:var(--display);font-weight:900;font-size:1.1rem;text-transform:uppercase;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--day);color:#fff}
.seg button.legs[aria-selected="true"]{color:var(--on-legs)}
.exl{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.exi{background:var(--surface);border-radius:16px;overflow:hidden}
.exi-h{width:100%;border:0;background:none;text-align:left;padding:14px;display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;cursor:pointer}
.num{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.1rem;color:var(--day)}
.exi-h b{display:block;font-weight:600;font-size:1.02rem;line-height:1.25}
.exi-h small{color:var(--muted);font-size:.82rem;font-family:var(--mono)}
.chev{width:20px;height:20px;color:var(--muted);transition:transform .2s}
.exi[open-x] .chev{transform:rotate(180deg)}
.exi-b{padding:0 14px 14px 62px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:.75rem;color:var(--muted)}
.tip{color:var(--muted);font-size:.92rem}
.last{font-family:var(--mono);font-size:.8rem;color:var(--ink)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:10px;background:var(--surface-2);color:var(--ink);text-decoration:none;font-weight:600;font-size:.85rem}
.links svg{width:16px;height:16px}
.note{font-size:.88rem;color:var(--muted);text-align:center}

/* Consejos */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat .big{font-family:var(--display);font-weight:900;font-size:1.8rem;line-height:1;font-variant-numeric:tabular-nums}
.stat .big small{font-size:.85rem;color:var(--muted);font-weight:700}
.stat p{font-size:.8rem;color:var(--muted)}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.rules li{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}
.rules b{font-weight:600}
.rules span{color:var(--muted);font-size:.9rem}
.profile{display:flex;gap:14px;font-family:var(--mono);font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.profile b{color:var(--ink);font-weight:500}

/* Entrenamiento a pantalla completa */
.train{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.train-in{max-width:560px;width:100%;margin:0 auto;height:100%;display:flex;flex-direction:column}
.t-top{flex:none;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.t-row{display:flex;align-items:center;gap:10px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:22px;height:22px}
.t-title{flex:1;min-width:0}
.t-title .lbl{color:var(--day)}
.t-time{font-family:var(--mono);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.t-end{border:0;border-radius:12px;min-height:44px;padding:0 16px;background:var(--ink);color:var(--bg);font-weight:700;cursor:pointer}
.pbar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.pbar span{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.t-prog{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.t-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(130px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.tex{background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;border:2px solid transparent;transition:border-color .2s}
.tex.current{border-color:var(--day)}
.tex.is-done{border-color:color-mix(in srgb,var(--ok) 60%,transparent)}
.tex-h{display:flex;gap:12px;align-items:center}
.tex-h .num{flex:none}
.tex.is-done .num{background:var(--ok);color:#fff}
.tex-h b{display:block;font-weight:600;font-size:1.05rem;line-height:1.2}
.tex-h small{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.tex-h a{margin-left:auto;flex:none}
.sets{display:flex;flex-direction:column;gap:6px}
.set-head,.set{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 50px;gap:8px;align-items:center}
.set-head{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.set-head span:last-child{text-align:center}
.sn{font-family:var(--mono);text-align:center;color:var(--muted);font-weight:500}
.fld{display:flex;align-items:center;gap:4px;background:var(--surface-2);border:1.5px solid transparent;border-radius:12px;padding:0 10px;min-height:48px;min-width:0}
.fld:focus-within{border-color:var(--day)}
.fld input{all:unset;flex:1;min-width:0;width:100%;font-family:var(--mono);font-size:1.15rem;font-variant-numeric:tabular-nums;color:var(--ink);padding:10px 0}
.fld input::placeholder{color:var(--muted);opacity:.55}
.fld span{font-size:.72rem;color:var(--muted)}
.tick{width:50px;height:48px;border-radius:12px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;color:transparent;padding:0}
.tick svg{width:24px;height:24px}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.set.is-done .sn{color:var(--ok)}
.set.is-done .fld{background:color-mix(in srgb,var(--ok) 12%,var(--surface-2))}

.restbar{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));border-radius:20px;background:var(--day);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.restbar.legs{color:var(--on-legs)}
.rb-t{flex:1;display:flex;flex-direction:column}
.rb-t .lbl{color:inherit;opacity:.8}
.rb-time{font-family:var(--mono);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.restbar button{border:2px solid currentColor;background:transparent;color:inherit;border-radius:12px;min-height:44px;padding:0 10px;font-weight:700;cursor:pointer;opacity:.9}
.restbar .rb-skip{background:#fff;color:#14171c;border-color:#fff;opacity:1}
.restbar.legs .rb-skip{background:var(--on-legs);color:#fff;border-color:var(--on-legs)}
@media (prefers-reduced-motion:no-preference){.restbar.over{animation:pulse 1s ease-in-out 3}.train{animation:up .25s ease-out}}
@keyframes pulse{50%{filter:brightness(1.2)}}
@keyframes up{from{transform:translateY(24px);opacity:.4}}

/* Hoja inferior */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet h3{font-size:1.8rem;font-weight:900;text-transform:uppercase}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum div{background:var(--surface-2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.sum b{font-family:var(--display);font-size:1.6rem;font-weight:900;font-variant-numeric:tabular-nums}
.sheet-btns{display:flex;flex-direction:column;gap:8px}
.btn{border:0;border-radius:14px;min-height:52px;font-weight:700;font-size:1rem;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--push)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:70}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div><div class="lbl" id="topLbl">Rutina PPL</div><h1 id="topTitle">Inicio</h1></div>
    <div class="sub" id="topSub"></div>
  </header>
  <main id="main"></main>
</div>

<nav class="nav" aria-label="Secciones">
  <div class="nav-in">
    <button type="button" data-view="home" aria-current="page"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>Inicio</button>
    <button type="button" data-view="plan"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12h3M19 12h3M5 8v8M8 6v12M16 6v12M19 8v8M8 12h8"/></svg></span>Rutina</button>
    <button type="button" data-view="tips"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3zM10 20h4"/></svg></span>Consejos</button>
  </div>
</nav>

<div class="train" id="train" hidden role="dialog" aria-modal="true" aria-labelledby="tDay">
  <div class="train-in">
    <div class="t-top">
      <div class="t-row">
        <button type="button" class="icon-btn" id="tMin" aria-label="Minimizar entrenamiento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="t-title"><div class="lbl" id="tDay">Empuje</div><div class="t-time" id="tTime" role="timer">00:00</div></div>
        <button type="button" class="t-end" id="tEnd">Terminar</button>
      </div>
      <div class="pbar"><span id="tBar"></span></div>
      <div class="t-prog"><span id="tProg">0/0 series</span><span id="tVol">0 kg</span></div>
    </div>
    <div class="t-list" id="tList"></div>
    <div class="restbar" id="restbar" hidden role="status">
      <div class="rb-t"><span class="lbl">Descanso</span><span class="rb-time" id="rbTime">0:00</span></div>
      <button type="button" id="rbMinus" aria-label="Quitar 15 segundos">−15</button>
      <button type="button" id="rbPlus" aria-label="Añadir 15 segundos">+15</button>
      <button type="button" id="rbSkip" class="rb-skip">Saltar</button>
    </div>
  </div>
</div>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
const D = {
  push:{name:"Empuje",k:"P",time:"60–70 min",muscles:"Pecho · hombro · tríceps",ex:[
    {n:"Press banca con barra",m:["Pecho","Tríceps","Hombro anterior"],s:4,r:"6–8",rest:"2–3 min",tip:"Escápulas juntas y abajo, pies firmes. Baja controlado hasta rozar el esternón.",q:"press banca barra técnica"},
    {n:"Press inclinado con mancuernas",m:["Pecho superior","Hombro"],s:3,r:"8–10",rest:"2 min",tip:"Banco a 30°. Codos a unos 45° del torso, no abiertos en cruz.",q:"press inclinado mancuernas técnica"},
    {n:"Press militar de pie",m:["Hombro","Tríceps","Core"],s:3,r:"6–8",rest:"2 min",tip:"Aprieta glúteos y abdomen para no arquear la espalda. La barra sube en línea recta.",q:"press militar de pie barra técnica"},
    {n:"Elevaciones laterales",m:["Hombro lateral"],s:4,r:"12–15",rest:"1 min",tip:"Peso ligero, sube hasta la altura del hombro con el codo un poco flexionado. Sin balanceo.",q:"elevaciones laterales mancuernas técnica"},
    {n:"Cruce de poleas",m:["Pecho"],s:3,r:"12–15",rest:"1 min",tip:"Aprieta el pecho 1 segundo al juntar las manos.",q:"cruce de poleas pecho técnica"},
    {n:"Extensión de tríceps en polea",m:["Tríceps"],s:3,r:"10–12",rest:"1 min",tip:"Codos pegados al cuerpo; solo se mueve el antebrazo.",q:"extension triceps polea técnica"},
    {n:"Fondos en paralelas (o press francés)",m:["Tríceps","Pecho"],s:3,r:"8–12",rest:"1–2 min",tip:"Torso recto para enfocar tríceps. Si te molestan los hombros, usa press francés con barra Z.",q:"fondos en paralelas triceps técnica"}
  ],extra:"Final opcional: plancha 3 × 30–45 s."},
  pull:{name:"Tirón",k:"T",time:"60–70 min",muscles:"Espalda · bíceps · hombro posterior",ex:[
    {n:"Dominadas (o jalón al pecho)",m:["Dorsal","Bíceps"],s:4,r:"6–10",rest:"2–3 min",tip:"Empieza tirando con la espalda, no con los brazos. Si no llegas a 6, usa jalón o banda de asistencia.",q:"dominadas técnica correcta"},
    {n:"Remo con barra",m:["Espalda media","Dorsal","Lumbar"],s:4,r:"6–8",rest:"2–3 min",tip:"Torso a unos 45°, espalda neutra. Lleva la barra al ombligo.",q:"remo con barra técnica"},
    {n:"Remo en polea baja",m:["Espalda media","Romboides"],s:3,r:"10–12",rest:"2 min",tip:"Pecho alto, junta las escápulas al final y vuelve despacio.",q:"remo polea baja técnica"},
    {n:"Face pull",m:["Hombro posterior","Trapecio"],s:3,r:"12–15",rest:"1 min",tip:"Cuerda a la altura de la cara, separa las manos al tirar. Muy bueno para la salud del hombro.",q:"face pull técnica"},

/* ---------- Estado ---------- */
function emptyDay(k){return D[k].ex.map(e=>({sets:Array.from({length:e.s},()=>({kg:"",reps:"",done:false}))}));}
function normDay(k,raw){
  const base=emptyDay(k); if(!raw) return base;
  const src=Array.isArray(raw)?raw:(raw.ex?Object.keys(raw.ex).map(i=>raw.ex[i]):[]); // acepta formato anterior
  base.forEach((x,i)=>{const r=src[i]; if(r&&Array.isArray(r.sets)) r.sets.forEach((s,j)=>{ if(x.sets[j]) x.sets[j]={kg:s.kg??"",reps:s.reps??"",done:!!s.done}; });});
  return base;
}
const old=store.get('ppl-log',{});
const LOG={}; ORDER.forEach(k=>LOG[k]=normDay(k,old[k]));
let HIST=store.get('ppl-hist',[]);         // [{day,start,end,sets,vol}]
let training=store.get('ppl-training',null); // {day,start}
let view=store.get('ppl-view','home'), planDay=store.get('ppl-plan','push');
if(!D[planDay]) planDay='push';
const saveLog=()=>store.set('ppl-log',LOG);

const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n;};
function stats(k){let t=0,d=0,vol=0;LOG[k].forEach(x=>x.sets.forEach(s=>{t++;if(s.done){d++;vol+=num(s.kg)*num(s.reps);}}));return{t,d,vol:Math.round(vol)};}
function nextDay(){ if(!HIST.length) return 'push'; const last=HIST[HIST.length-1].day; return ORDER[(ORDER.indexOf(last)+1)%3]; }
function lastOf(k){ for(let i=HIST.length-1;i>=0;i--) if(HIST[i].day===k) return HIST[i]; return null; }
const fmt=sec=>{sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return(h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(s).padStart(2,'0');};
const fmtDur=ms=>{const m=Math.round(ms/60000);return m>=60?`${Math.floor(m/60)} h ${m%60} min`:`${m} min`;};
function ago(ts){const d0=new Date();d0.setHours(0,0,0,0);const d1=new Date(ts);d1.setHours(0,0,0,0);const n=Math.round((d0-d1)/864e5);return n===0?'Hoy':n===1?'Ayer':`Hace ${n} días`;}
function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200);}

/* ---------- Entrenamiento ---------- */
let tickT=null, wake=null, restEnd=null;
async function keepAwake(){try{if(navigator.wakeLock) wake=await navigator.wakeLock.request('screen');}catch(e){wake=null;}}
document.addEventListener('visibilitychange',()=>{if(training&&!$('train').hidden&&document.visibilityState==='visible') keepAwake();});

function startTraining(k){
  if(training && training.day!==k){ return sheetConfirm(`Tienes ${D[training.day].name} en curso`,'Si empiezas otro día, el entrenamiento actual se descarta sin guardarse en el historial.','Empezar '+D[k].name,()=>{training=null;startTraining(k);}); }
  if(!training){
    LOG[k].forEach(x=>x.sets.forEach(s=>s.done=false)); saveLog();
    training={day:k,start:Date.now()}; store.set('ppl-training',training);
  }
  openTrain();
}
function openTrain(){
  const k=training.day, tr=$('train');
  tr.style.setProperty('--day',`var(--${k})`); tr.className='train '+k; tr.hidden=false;
  $('tDay').textContent='Entrenando · '+D[k].name;
  renderTrainList(); updTrain(); clearInterval(tickT); tickT=setInterval(()=>{updTimer();tickRest();},1000); updTimer(); keepAwake();
  document.body.style.overflow='hidden';
  requestAnimationFrame(()=>scrollToCurrent(false));
}
function closeTrain(){ $('train').hidden=true; clearInterval(tickT); hideRest(); try{wake&&wake.release();}catch(e){} wake=null; document.body.style.overflow=''; render(); }
function updTimer(){ if(training) $('tTime').textContent=fmt((Date.now()-training.start)/1000); }
function currentIdx(){ const L=LOG[training.day]; const i=L.findIndex(x=>x.sets.some(s=>!s.done)); return i; }
function updTrain(){
  const k=training.day, st=stats(k);
  $('tProg').textContent=`${st.d}/${st.t} series`; $('tVol').textContent=`${st.vol.toLocaleString('es-ES')} kg`;
  $('tBar').style.width=(st.t?st.d/st.t*100:0)+'%';
  const cur=currentIdx();
  document.querySelectorAll('.tex').forEach((el,i)=>{const done=LOG[k][i].sets.every(s=>s.done);el.classList.toggle('is-done',done);el.classList.toggle('current',i===cur);});
}
function renderTrainList(){
  const k=training.day;
  $('tList').innerHTML=D[k].ex.map((e,i)=>`<section class="tex" data-i="${i}">
    <div class="tex-h"><span class="num">${i+1}</span><div><b>${esc(e.n)}</b><small>${e.s} × ${e.r} · ${e.rest}</small></div>
      <a class="icon-btn" href="${YT+encodeURIComponent(e.q)}" target="_blank" rel="noopener" aria-label="Ver vídeo de ${esc(e.n)}">${I.yt}</a></div>
    <div class="sets">
      <div class="set-head"><span></span><span>Peso</span><span>Reps</span><span>Hecha</span></div>
      ${LOG[k][i].sets.map((s,j)=>`<div class="set ${s.done?'is-done':''}" data-j="${j}">
        <span class="sn">${j+1}</span>
        <label class="fld"><input id="kg-${k}-${i}-${j}" type="text" inputmode="decimal" autocomplete="off" placeholder="—" value="${esc(s.kg)}" data-f="kg" aria-label="Kg, serie ${j+1}"><span>kg</span></label>
        <label class="fld"><input id="rp-${k}-${i}-${j}" type="text" inputmode="numeric" autocomplete="off" placeholder="${esc(e.r.split(' ')[0])}" value="${esc(s.reps)}" data-f="reps" aria-label="Repeticiones, serie ${j+1}"><span>reps</span></label>
        <button type="button" class="tick" aria-pressed="${s.done}" aria-label="Serie ${j+1} hecha">${I.check}</button>
      </div>`).join('')}
    </div></section>`).join('')+`<p class="note">${D[k].extra}</p>`;
}
function scrollToCurrent(smooth=true){
  const i=currentIdx(); if(i<0) return; const el=document.querySelector(`.tex[data-i="${i}"]`); if(!el) return;
  const list=$('tList'); list.scrollTo({top:el.offsetTop-list.offsetTop-8,behavior:smooth&&!matchMedia('(prefers-reduced-motion: reduce)').matches?'smooth':'auto'});
}
$('tList').addEventListener('input',e=>{
  const inp=e.target; if(!inp.dataset.f) return;
  const i=+inp.closest('.tex').dataset.i, j=+inp.closest('.set').dataset.j;
  inp.value=inp.dataset.f==='kg'?inp.value.replace(/[^0-9.,]/g,''):inp.value.replace(/[^0-9]/g,'');
  LOG[training.day][i].sets[j][inp.dataset.f]=inp.value; saveLog(); if(LOG[training.day][i].sets[j].done) updTrain();
});
$('tList').addEventListener('click',e=>{
  const tick=e.target.closest('.tick'); if(!tick) return;
  const k=training.day, row=tick.closest('.set'), i=+tick.closest('.tex').dataset.i, j=+row.dataset.j;
  const sets=LOG[k][i].sets, s=sets[j]; s.done=!s.done;
  if(s.done&&sets[j-1]){const p=sets[j-1]; if(!s.kg&&p.kg){s.kg=p.kg;row.querySelector('[data-f=kg]').value=s.kg;} if(!s.reps&&p.reps){s.reps=p.reps;row.querySelector('[data-f=reps]').value=s.reps;}}
  row.classList.toggle('is-done',s.done); tick.setAttribute('aria-pressed',s.done);
  try{navigator.vibrate&&navigator.vibrate(s.done?30:10);}catch(_){}
  saveLog(); updTrain();
  if(s.done){
    const st=stats(k);
    if(st.d===st.t){ hideRest(); finishSheet(); return; }
    startRest(D[k].ex[i].rest);
    if(sets.every(x=>x.done)) setTimeout(()=>scrollToCurrent(true),350);
  }
});
$('tMin').addEventListener('click',closeTrain);
$('tEnd').addEventListener('click',finishSheet);

function restSecs(t){const n=parseFloat(String(t).replace(',','.'));return(isNaN(n)?1.5:n)*60;}
function startRest(t){restEnd=Date.now()+restSecs(t)*1000;const rb=$('restbar');rb.hidden=false;rb.className='restbar'+(training.day==='legs'?' legs':'');tickRest();}
function hideRest(){restEnd=null;$('restbar').hidden=true;}
function tickRest(){
  if(!restEnd) return; const left=(restEnd-Date.now())/1000, rb=$('restbar');
  $('rbTime').textContent=left>0?fmt(left).replace(/^0/,''):'¡Vamos!';
  if(left<=0&&!rb.classList.contains('over')){rb.classList.add('over');try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}
  if(left<-20) hideRest();
}
$('rbSkip').addEventListener('click',hideRest);
$('rbPlus').addEventListener('click',()=>{if(restEnd){restEnd=Math.max(restEnd,Date.now())+15000;$('restbar').classList.remove('over');tickRest();}});
$('rbMinus').addEventListener('click',()=>{if(restEnd){restEnd-=15000;tickRest();}});

function openSheet(html,bind){ $('sheet').innerHTML='<div class="grab"></div>'+html; $('scrim').hidden=false; bind&&bind($('sheet')); const f=$('sheet').querySelector('button'); f&&f.focus(); }
function closeSheet(){ $('scrim').hidden=true; }
$('scrim').addEventListener('click',e=>{ if(e.target.id==='scrim') closeSheet(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('scrim').hidden) closeSheet(); });
function sheetConfirm(title,text,okLabel,ok){

    sh=>{sh.querySelector('[data-ok]').onclick=()=>{closeSheet();ok();};sh.querySelector('[data-no]').onclick=closeSheet;});
}
function finishSheet(){
  const k=training.day, st=stats(k), dur=Date.now()-training.start, full=st.d===st.t;
  openSheet(`<span class="lbl">${D[k].name}</span><h3>${full?'¡Entrenamiento completado!':'¿Terminar entrenamiento?'}</h3>
    <div class="sum"><div><span class="lbl">Tiempo</span><b>${fmt(dur/1000)}</b></div><div><span class="lbl">Series</span><b>${st.d}/${st.t}</b></div><div><span class="lbl">Volumen</span><b>${st.vol.toLocaleString('es-ES')}</b></div></div>
    ${full?'':'<p class="tip">Te quedan series por marcar. Lo que has apuntado se guarda igualmente.</p>'}
    <div class="sheet-btns"><button type="button" class="btn primary" data-save>Guardar y terminar</button>${full?'':'<button type="button" class="btn ghost" data-cont>Seguir entrenando</button>'}<button type="button" class="btn danger" data-discard>Descartar entrenamiento</button></div>`,
  sh=>{
    sh.querySelector('[data-save]').onclick=()=>{
      if(st.d>0){ HIST.push({day:k,start:training.start,end:Date.now(),sets:st.d,vol:st.vol}); if(HIST.length>200) HIST=HIST.slice(-200); store.set('ppl-hist',HIST); }
      training=null; store.set('ppl-training',null); closeSheet(); view='home'; store.set('ppl-view',view); closeTrain(); toast(st.d>0?'Entrenamiento guardado':'Entrenamiento cerrado');
    };
    const c=sh.querySelector('[data-cont]'); if(c) c.onclick=closeSheet;
    sh.querySelector('[data-discard]').onclick=()=>{ training=null; store.set('ppl-training',null); closeSheet(); closeTrain(); toast('Entrenamiento descartado'); };
  });
}

/* ---------- Eventos generales ---------- */
document.querySelector('.nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.view;store.set('ppl-view',view);render();});
$('main').addEventListener('click',e=>{
  const t=e.target.closest('[data-train]'); if(t){startTraining(t.dataset.train);return;}
  const p=e.target.closest('[data-plan]'); if(p){planDay=p.dataset.plan;store.set('ppl-plan',planDay);render();return;}
  const x=e.target.closest('[data-exp]'); if(x){const li=x.closest('.exi'),b=li.querySelector('.exi-b'),open=b.hidden;b.hidden=!open;x.setAttribute('aria-expanded',open);li.toggleAttribute('open-x',open);return;}
  if(e.target.id==='wipe'){ sheetConfirm('Borrar todos los datos','Se borrarán los kg, repeticiones e historial guardados en este móvil. No se puede deshacer.','Borrar todo',()=>{ORDER.forEach(k=>LOG[k]=emptyDay(k));HIST=[];training=null;saveLog();store.set('ppl-hist',HIST);store.set('ppl-training',null);render();toast('Datos borrados');}); }
});

render();
if(training && D[training.day]) openTrain();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
</html>
